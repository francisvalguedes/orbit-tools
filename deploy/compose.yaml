# orbit-tools com Docker Compose. Guia: docs/implantacao_docker.md
# Na pasta da instalação: este arquivo e, opcionais, .env e config/ (locais e radares da instalação).
name: orbit-tools

services:
  orbit-tools:
    # Versão: IMAGE_TAG no .env (main = último commit da main; ou uma versão, ex.: v0.2.0)
    image: ghcr.io/francisvalguedes/orbit-tools:${IMAGE_TAG:-main}
    restart: unless-stopped
    # Só na própria máquina: o nginx publica na rede (ver docs/implantacao_systemd.md, seção nginx)
    ports:
      - "127.0.0.1:8010:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Caches (EOP, SATCAT, Celestrak), conjuntos de elementos e ZIPs: volume do Docker, mantido nas atualizações
      - dados:/data
      # Locais e radares da instalação (locais.csv, radares.csv): descomente e crie a pasta config/
      #- ./config:/config:ro

volumes:
  dados:
