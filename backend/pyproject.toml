[project]
name = "orbit-tools"
version = "0.1.0"
description = "Propagação de órbita (SGP4), passagens sobre sensores, trajetórias para rastreio e conversões de coordenadas"
readme = "README.md"
license = "MIT"
authors = [{ name = "francisvalguedes" }]
requires-python = ">=3.12"
# Núcleo de cálculo (orbit_tools.core): só numpy e sgp4, para uso como biblioteca.
dependencies = [
    "numpy>=2.2",
    "sgp4>=2.24",
]

[project.optional-dependencies]
# API web e acesso às fontes de elementos (orbit_tools.api, orbit_tools.sources)
server = [
    "fastapi>=0.115",
    "httpx2>=2.16",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
orbit-tools = "orbit_tools:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "astropy>=8.0.2",
    "orbit-tools[server]",
    "pymap3d>=3.2.0",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # caracteres unicode (°, ², ε) são intencionais
